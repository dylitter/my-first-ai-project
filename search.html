<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索列表</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px;
      background: #f5f7fb;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .search-bar {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      height: 44px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .message {
      margin: 16px 0 0;
      color: #6b7280;
      min-height: 24px;
    }

    .result-list {
      display: grid;
      gap: 12px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .result-item {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
    }

    .result-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .result-desc {
      margin: 0;
      color: #4b5563;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>搜索列表</h1>

    <div class="search-bar">
      <input id="keywordInput" type="text" placeholder="请输入关键词，例如 AI" autocomplete="off">
      <button id="searchButton" type="button">搜索</button>
    </div>

    <p id="message" class="message">输入关键词后点击搜索按钮。</p>
    <ul id="resultList" class="result-list"></ul>
  </main>

  <script>
    const keywordInput = document.getElementById('keywordInput');
    const searchButton = document.getElementById('searchButton');
    const message = document.getElementById('message');
    const resultList = document.getElementById('resultList');

    function renderList(list) {
      resultList.innerHTML = '';

      list.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'result-item';
        li.innerHTML = `
          <h2 class="result-title">${escapeHtml(item.title)}</h2>
          <p class="result-desc">${escapeHtml(item.desc)}</p>
        `;
        resultList.appendChild(li);
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function search() {
      const keyword = keywordInput.value.trim();

      if (!keyword) {
        resultList.innerHTML = '';
        message.textContent = '请输入搜索关键词。';
        return;
      }

      searchButton.disabled = true;
      message.textContent = '搜索中...';

      try {
        const response = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '搜索失败');
        }

        renderList(data.list || []);
        message.textContent = data.list && data.list.length
          ? `找到 ${data.list.length} 条结果`
          : '没有找到匹配结果';
      } catch (error) {
        resultList.innerHTML = '';
        message.textContent = error.message;
      } finally {
        searchButton.disabled = false;
      }
    }

    searchButton.addEventListener('click', search);
    keywordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        search();
      }
    });
  </script>
</body>
</html>
